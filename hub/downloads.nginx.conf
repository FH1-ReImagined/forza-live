# The hub's download host (compose.yaml, hub-downloads): another host name than the website's,
# behind the TLS proxy. It serves only the approved zips the accounts service copied to the
# public volume, at /<sha256>/<name>.zip, as downloads: never as a page, never sniffed, never
# a folder listing, never through a link.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /srv/hub;
    autoindex off;
    disable_symlinks on;
    types { }
    default_type application/octet-stream;
    # Kept short: no query strings or cookies are used.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    limit_conn per_ip 4;

    location ~ "^/[0-9a-f]{64}/[A-Za-z0-9][A-Za-z0-9_-]{0,39}\.zip$" {
        limit_except GET { deny all; }
        default_type application/zip;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # Content-addressed: a file never changes under its name.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
