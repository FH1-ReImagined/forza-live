# The mods and texture packs hub's containers (README.md in this folder): the scanning worker, its
# ClamAV signature updater and the download host. The website accounts service (accounts/) runs
# beside them and shares the incoming, checked and public volumes (README.md, "Running it").
#   docker compose -f hub/compose.yaml up -d --build
# Nothing here is reachable from the internet but hub-downloads, through the TLS proxy, at its own
# host name.
name: forza-hub

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "2"}

services:
  # Sets the volumes' owners and modes once (README.md, "The folders"), then exits.
  hub-init:
    image: forza-hub-scanner:latest
    build: .
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        chown 10001:10001 /v/incoming && chmod 2750 /v/incoming &&
        chown 10002:10001 /v/checked && chmod 2770 /v/checked &&
        chown 10001:10001 /v/public && chmod 0755 /v/public &&
        chown 10002:10002 /v/work /v/signatures && chmod 0700 /v/work && chmod 0755 /v/signatures
    volumes:
      - incoming:/v/incoming
      - checked:/v/checked
      - public:/v/public
      - work:/v/work
      - signatures:/v/signatures
    restart: "no"

  # The scanning worker: no network at all, a read-only root, no privileges. It reads uploads,
  # writes clean zips and results, and reads the signatures.
  hub-scanner:
    <<: *hardened
    image: forza-hub-scanner:latest
    build: .
    network_mode: none
    user: "10002:10002"
    group_add: ["10001"]   # reads the accounts service's uploads (incoming is 2750, group 10001)
    environment:
      FORZA_HUB_MAX_MB: "512"
    command: ["--incoming", "/incoming", "--checked", "/checked", "--work", "/work", "--clamav-db", "/clamav-db"]
    pids_limit: 64
    mem_limit: 2g
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - incoming:/incoming:ro
      - checked:/checked
      - work:/work
      - signatures:/clamav-db:ro
    depends_on:
      hub-init: {condition: service_completed_successfully}

  # ClamAV's signatures, from ClamAV's mirror (the only one of these with a network), into the
  # volume the scanner reads.
  hub-signatures:
    <<: *hardened
    image: forza-hub-scanner:latest
    build: .
    user: "10002:10002"
    entrypoint: ["freshclam", "--config-file=/app/freshclam.conf", "--daemon", "--foreground"]
    pids_limit: 32
    mem_limit: 1g
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - signatures:/clamav-db
    depends_on:
      hub-init: {condition: service_completed_successfully}

  # The download host: the approved zips, read-only, as attachments (downloads.nginx.conf). Put
  # it behind the TLS proxy at its own host name (FORZA_HUB_DOWNLOADS), never the site's.
  hub-downloads:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:stable-alpine   # pin it by digest when deploying
    pids_limit: 64
    mem_limit: 256m
    tmpfs:
      - /tmp:size=16m
    ports:
      - "127.0.0.1:8090:8080"   # the TLS proxy's side only; change to the proxy's network
    volumes:
      - public:/srv/hub:ro
      - ./downloads.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./downloads.http.conf:/etc/nginx/conf.d/00-limits.conf:ro

volumes:
  incoming: {name: forza-hub-incoming}
  checked: {name: forza-hub-checked}
  public: {name: forza-hub-public}
  work: {name: forza-hub-work}
  signatures: {name: forza-hub-signatures}
