# The hub's signature updater (compose.yaml, hub-signatures): ClamAV's official mirror, into the
# volume the scanner mounts read-only. Checked 12 times a day.
DatabaseDirectory /clamav-db
DatabaseMirror database.clamav.net
UpdateLogFile /tmp/freshclam.log
LogTime yes
PidFile /tmp/freshclam.pid
Foreground yes
Checks 12
ConnectTimeout 30
ReceiveTimeout 300
# The scanner reads the files; nothing is notified.
TestDatabases yes
Bytecode yes
