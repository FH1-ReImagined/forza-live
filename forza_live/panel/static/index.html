<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Forza Live operator panel</title>
<link rel="stylesheet" href="/operator/panel.css">
<script src="/operator/panel.js" defer></script>
</head>
<body>
<header>
  <h1>Forza Live operator panel</h1>
  <nav id="tabs" aria-label="Sections"></nav>
  <button type="button" id="forget" class="quiet" hidden>Forget the token</button>
</header>
<main id="main">
  <section id="login" class="card narrow" hidden>
    <h2>Admin token</h2>
    <p>Type the server's admin token (FORZA_ADMIN_TOKEN). It stays in this tab only
    (sessionStorage) and is sent as a header with each request; closing the tab forgets it.</p>
    <form id="login-form">
      <label>Token <input type="password" id="token" autocomplete="off" required></label>
      <button type="submit">Open the panel</button>
    </form>
    <p id="login-message" class="error" role="alert"></p>
  </section>
  <div id="flash" role="status" aria-live="polite"></div>
  <div id="view"></div>
</main>
<noscript>The operator panel needs JavaScript.</noscript>
</body>
</html>
