# Forza Live with Docker Compose: copy .env.example to .env, set the token, then
#   docker compose up -d --build
# Players set this server's address in the launcher (Settings, Online, My own server).
# Ports, tunnels and every option: docs/configuration.md, or `python3 forza_live_server.py --help`.
services:
  forza-live:
    build: .
    image: forza-live:latest
    container_name: forza-live
    # UDP 21200 (game) and TCP 21201 (title services, website, operator endpoints).
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "1"
    env_file: .env
    volumes:
      - ./data:/data
    command:
      - --host=0.0.0.0
      # The game's database enables the Horizon World event list: copy media/db/gamedb.slt
      # from your game files into ./data, then uncomment (or set FORZA_GAME_DB in .env).
      # - --game-db=/data/gamedb.slt
      # Behind a tunnel or reverse proxy: trust it, so player addresses are real.
      # - --trusted-proxy=127.0.0.0/8
      # A name for this server's leaderboard rows (default: data/server_id.txt).
      # - --server-id=my-server

  # The video converter (video/README.md): the game's movie uploads become MP4s the website plays.
  # Off unless the profile is on: COMPOSE_PROFILES=videos in .env. No network, a read-only root;
  # it reads the clips read-only and writes only its results.
  videos-init:
    profiles: [videos]
    image: forza-video-converter:latest
    build: video
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /v/incoming /v/converted && chown 10003:10003 /v/converted && chmod 0755 /v/converted"]
    volumes:
      - ./data/videos:/v
    restart: "no"

  video-converter:
    profiles: [videos]
    image: forza-video-converter:latest
    build: video
    network_mode: none
    user: "10003:10003"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    command: ["--incoming", "/incoming", "--converted", "/converted"]
    pids_limit: 64
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.0
    tmpfs:
      - /tmp:size=16m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    volumes:
      - ./data/videos/incoming:/incoming:ro
      - ./data/videos/converted:/converted
    depends_on:
      videos-init: {condition: service_completed_successfully}
